[project]
name = "trackflow-api"
version = "0.1.0"
description = "TrackFlow incident analysis and supplier directory API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "libpass[bcrypt]>=1.9.4",
  "pydantic>=2.11,<3",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.20,<1",
  "tinydb>=4.8,<5",
  "uvicorn>=0.35,<1",
]

[project.scripts]
seed = "services.api.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.pytest.ini_options]
testpaths = ["tests", "services/api/tests"]
addopts = "--import-mode=importlib"
pythonpath = [".", "services/api/tests"]

[tool.coverage.run]
branch = true
source = [
  "services.api.auth",
  "services.api.auth_database",
  "services.api.auth_dependencies",
  "services.api.auth_models",
  "services.api.email_delivery",
  "services.api.routes.auth",
  "services.api.routes.users",
  "services.api.routes.profiles",
  "services.api.app.routers.incident_management",
  "services.api.incident_models",
  "services.api.incident_store",
  "packages.shared.incidents",
  "services.api.database",
  "services.api.models",
  "services.api.routes.suppliers",
]

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
