[project]
name = "trackflow-api"
version = "0.1.0"
description = "TrackFlow incident analysis and supplier directory API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "tinydb>=4.8,<5",
  "uvicorn>=0.35,<1",
]

[project.scripts]
seed = "services.api.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]
