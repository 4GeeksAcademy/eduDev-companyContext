# Include in nginx's http context. See README.md for staged activation.
server {
    listen 80;
    server_name 162.243.69.7;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/trackflow-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://162.243.69.7$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name 162.243.69.7;
    # Confirm these production lineage paths with certbot certificates first.
    ssl_certificate /etc/letsencrypt/live/trackflow-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackflow-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    location = / {
        return 308 /uis/website/$is_args$args;
    }
    location = /favicon.ico {
        return 308 /uis/website/favicon.svg$is_args$args;
    }
    location = /uis/website {
        proxy_pass http://127.0.0.1:3000;
    }
    location ^~ /uis/website/ {
        proxy_pass http://127.0.0.1:3000;
    }
    location = /talent {
        proxy_pass http://127.0.0.1:3003;
    }
    location ^~ /talent/ {
        proxy_pass http://127.0.0.1:3003;
    }
    # Next owns backoffice, root assets, API allowlisting and unknown-route 404s.
    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
