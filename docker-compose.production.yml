# Image-only: build locally using the root README, never on the VPS.
services:
  ui:
    image: ${TRACKFLOW_UI_IMAGE:?Set TRACKFLOW_UI_IMAGE to a production-built tag}
    init: true
    restart: unless-stopped
    environment:
      TRACKFLOW_UI_MODE: production
      BACKOFFICE_LEGACY_PORT: "3002"
      TRACKFLOW_API_PROXY: "1"
      TRACKFLOW_API_ORIGIN: http://api:8000
    ports:
      - "${TRACKFLOW_BIND_ADDRESS:-127.0.0.1}:${WEBSITE_HOST_PORT:-3000}:3000"
      - "${TRACKFLOW_BIND_ADDRESS:-127.0.0.1}:${BACKOFFICE_HOST_PORT:-3001}:3001"
    logging: &bounded_logs
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - trackflow
  api:
    image: ${TRACKFLOW_API_IMAGE:?Set TRACKFLOW_API_IMAGE to a locally built tag}
    restart: unless-stopped
    command: [uvicorn, services.api.main:app, --host, 0.0.0.0, --port, "8000", --workers, "1"]
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set a private JWT_SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-}
      TRACKFLOW_CORS_ORIGINS: ${TRACKFLOW_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      TRACKFLOW_USERS_DB_PATH: /app/data/users.json
      TRACKFLOW_SUPPLIERS_DB_PATH: /app/data/suppliers.json
      TRACKFLOW_INCIDENTS_DB_PATH: /app/data/incidents.json
    volumes:
      - production_api_data:/app/data
    logging: *bounded_logs
    networks:
      - trackflow
networks:
  trackflow:
    name: ${COMPOSE_PROJECT_NAME:-trackflow-production}_network
volumes:
  production_api_data:
